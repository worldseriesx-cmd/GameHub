<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Neo Contra: Hardcore Edition</title>
  <style>
    :root {
      --bg: #05070e;
      --cyan: #00f3ff;
      --pink: #ff0055;
      --yellow: #ffe600;
      --green: #00ff66;
    }

    /* ล็อกการซูมและ Gesture ทุกรูปแบบบน iPad Chrome & Safari */
    html, body, #viewport, canvas, #controls, button {
      touch-action: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      overscroll-behavior: none !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* ใช้ dynamic viewport height ป้องกันปุ่มจม */
      display: flex;
      flex-direction: column;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 100;
      opacity: 0.5;
    }

    header {
      flex-shrink: 0;
      height: 44px;
      background: rgba(14, 18, 30, 0.96);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10;
      gap: 8px;
    }
    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .game-badge {
      font-weight: 900;
      font-size: 0.9rem;
      color: var(--pink);
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
    }
    .hud-text {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--yellow);
    }
    .btn-action {
      background: #1e2438;
      border: 1px solid #3d486c;
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-action:active {
      transform: scale(0.95);
      border-color: var(--cyan);
    }
    .btn-secret {
      background: rgba(255, 230, 0, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
      font-weight: 900;
    }

    #viewport {
      flex: 1;
      min-height: 0; /* สำคัญมาก: ป้องกันไม่ให้ Canvas ขยายดันแผงปุ่มด้านล่างจม */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
    }

    .overlay-modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 19, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
    }
    .modal-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .modal-title.win {
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255, 230, 0, 0.6);
    }
    .modal-title.over {
      color: var(--pink);
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }
    .modal-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      font-family: monospace;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
    }
    .modal-btn {
      background: var(--cyan);
      border: none;
      color: #000;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      touch-action: manipulation;
    }

    /* 8-Direction Control Dock (แก้ขนาดไม่ให้จมขอบจอ iPad) */
    #controls {
      flex-shrink: 0;
      height: 160px;
      background: rgba(10, 13, 24, 0.98);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px max(10px, env(safe-area-inset-bottom)) 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 3px;
    }
    .dbtn {
      background: #182035;
      border: 1px solid #2d385e;
      color: #94a3b8;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px #0c101c;
    }
    .dbtn.primary-dir {
      color: #fff;
      font-size: 1.2rem;
      background: #1f2845;
    }
    .dbtn.diag-dir {
      background: #141a2c;
      color: #64748b;
      font-size: 0.85rem;
    }
    .dbtn:active, .dbtn.active {
      background: var(--cyan) !important;
      color: #000 !important;
      transform: translateY(2px);
      box-shadow: 0 1px #0c101c;
    }

    .action-group {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .abtn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #202742;
      border: 2px solid;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px #0d111e;
    }
    .abtn span {
      font-size: 0.58rem;
      font-weight: normal;
      opacity: 0.7;
    }
    .btn-a { border-color: var(--green); }
    .btn-b { border-color: var(--pink); }
    .btn-a:active, .btn-a.active { background: var(--green); color: #000; transform: translateY(2px); }
    .btn-b:active, .btn-b.active { background: var(--pink); color: #000; transform: translateY(2px); }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <header>
    <div class="hud-left">
      <div class="game-badge">🪖 NEO CONTRA</div>
      <div class="hud-text" id="score-val">1P 00000</div>
      <div class="hud-text" id="lives-val">★ x3</div>
      <div class="hud-text" id="gun-val" style="color:var(--cyan);">[R] RIFLE</div>
    </div>
    <div class="hud-right">
      <button class="btn-action btn-secret" onclick="activateKonami()">★ 30 LIVES</button>
      <a href="index.html" class="btn-action">🔙 MENU</a>
    </div>
  </header>

  <div id="viewport">
    <canvas id="contraCanvas" width="480" height="270"></canvas>

    <div class="overlay-modal" id="stage-clear-modal">
      <div class="modal-title win">STAGE CLEAR!</div>
      <div class="modal-desc" id="stage-clear-desc">OUTPOST DEFENSES ANNIHILATED</div>
      <button class="modal-btn" onclick="nextStage()">NEXT STAGE ▶</button>
    </div>

    <div class="overlay-modal" id="game-over-modal">
      <div class="modal-title over">GAME OVER</div>
      <div class="modal-desc">MISSION FAILED.<br>GET READY FOR RETRY!</div>
      <button class="modal-btn" onclick="restartGame()">CONTINUE</button>
    </div>

    <div class="overlay-modal" id="victory-modal">
      <div class="modal-title win">MISSION ACCOMPLISHED!</div>
      <div class="modal-desc">CONGRATULATIONS SOLDIER!<br>ALL ALIEN BASES ANNIHILATED.</div>
      <button class="modal-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div id="controls">
    <div class="dpad-container">
      <button class="dbtn diag-dir" data-dir="upleft">↖</button>
      <button class="dbtn primary-dir" data-dir="up">▲</button>
      <button class="dbtn diag-dir" data-dir="upright">↗</button>
      <button class="dbtn primary-dir" data-dir="left">◀</button>
      <div style="background:transparent; border:none;"></div>
      <button class="dbtn primary-dir" data-dir="right">▶</button>
      <button class="dbtn diag-dir" data-dir="downleft">↙</button>
      <button class="dbtn primary-dir" data-dir="down">▼</button>
      <button class="dbtn diag-dir" data-dir="downright">↘</button>
    </div>

    <div class="action-group">
      <button class="abtn btn-b" data-action="b">B<span>FIRE</span></button>
      <button class="abtn btn-a" data-action="a">A<span>JUMP</span></button>
    </div>
  </div>

  <script>
    // --- ป้องกันจอซูมบน Chrome & Safari บน iPad ---
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // --- Synthesized Retro Sound Engine ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playTone(freq, type, dur, endFreq = null, gainVal = 0.1) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + dur);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      },
      rifle() { this.playTone(720, 'square', 0.06, 180, 0.12); },
      spread() { this.playTone(550, 'sawtooth', 0.1, 100, 0.15); },
      laser() { this.playTone(950, 'triangle', 0.14, 280, 0.16); },
      jump() { this.playTone(180, 'sine', 0.14, 520, 0.12); },
      hit() { this.playTone(140, 'sawtooth', 0.08, 40, 0.1); },
      boom() { this.playTone(90, 'square', 0.35, 20, 0.22); },
      powerup() {
        if (!this.ctx) return;
        [350, 440, 580, 880].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.1, null, 0.12), i * 60);
        });
      },
      secret() {
        if (!this.ctx) return;
        [523, 659, 783, 1046, 1318].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'square', 0.12, null, 0.16), i * 75);
        });
      },
      winFanfare() {
        if (!this.ctx) return;
        [440, 440, 440, 587, 659, 880].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.2, null, 0.18), i * 110);
        });
      }
    };

    // --- 8-Way Input Manager ---
    const Input = {
      up: false, down: false, left: false, right: false,
      a: false, b: false,
      resetDirs() { this.up = this.down = this.left = this.right = false; }
    };

    const dirMap = {
      'up':        { up: true,  down: false, left: false, right: false },
      'down':      { up: false, down: true,  left: false, right: false },
      'left':      { up: false, down: false, left: true,  right: false },
      'right':     { up: false, down: false, left: false, right: true },
      'upleft':    { up: true,  down: false, left: true,  right: false },
      'upright':   { up: true,  down: false, left: false, right: true },
      'downleft':  { up: false, down: true,  left: true,  right: false },
      'downright': { up: false, down: true,  left: false, right: true }
    };

    document.querySelectorAll('[data-dir]').forEach(btn => {
      const dirKey = btn.getAttribute('data-dir');
      const applyDir = (active) => {
        AudioEngine.init();
        if (active) {
          const cfg = dirMap[dirKey];
          Input.up = cfg.up; Input.down = cfg.down;
          Input.left = cfg.left; Input.right = cfg.right;
          btn.classList.add('active');
        } else {
          Input.resetDirs();
          btn.classList.remove('active');
        }
      };
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); applyDir(true); });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); applyDir(false); });
      btn.addEventListener('pointercancel', (e) => { e.preventDefault(); applyDir(false); });
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
      const act = btn.getAttribute('data-action');
      const setAct = (active) => {
        AudioEngine.init();
        Input[act] = active;
        if (active) btn.classList.add('active'); else btn.classList.remove('active');
      };
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); setAct(true); });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); setAct(false); });
      btn.addEventListener('pointercancel', (e) => { e.preventDefault(); setAct(false); });
    });

    window.addEventListener('keydown', (e) => {
      AudioEngine.init();
      if (e.code === 'ArrowUp' || e.key === 'w') Input.up = true;
      if (e.code === 'ArrowDown' || e.key === 's') Input.down = true;
      if (e.code === 'ArrowLeft' || e.key === 'a') Input.left = true;
      if (e.code === 'ArrowRight' || e.key === 'd') Input.right = true;
      if (e.code === 'Space' || e.key === 'k') Input.a = true;
      if (e.key === 'j' || e.key === 'z') Input.b = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowUp' || e.key === 'w') Input.up = false;
      if (e.code === 'ArrowDown' || e.key === 's') Input.down = false;
      if (e.code === 'ArrowLeft' || e.key === 'a') Input.left = false;
      if (e.code === 'ArrowRight' || e.key === 'd') Input.right = false;
      if (e.code === 'Space' || e.key === 'k') Input.a = false;
      if (e.key === 'j' || e.key === 'z') Input.b = false;
    });

    function activateKonami() {
      AudioEngine.init();
      if (gameState.lives < 30) {
        gameState.lives = 30;
        AudioEngine.secret();
        FX.addText(gameState.player.x, gameState.player.y - 30, "★ 30 LIVES GRANTED! ★", "#ffe600");
        updateHUD();
      }
    }

    // --- Particle Engine ---
    const FX = {
      particles: [],
      texts: [],
      shake: 0,
      addExplosion(x, y, color = '#ff0055', count = 16) {
        this.shake = Math.min(this.shake + 6, 14);
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 1.5 + Math.random() * 4.5;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color,
            life: 18 + Math.random() * 12,
            maxLife: 30,
            r: 2 + Math.random() * 3
          });
        }
      },
      addText(x, y, str, color = '#fff') {
        this.texts.push({ x, y, str, color, life: 40, vy: -1 });
      },
      update() {
        if (this.shake > 0) this.shake *= 0.88;
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.95;
          p.vy *= 0.95;
          if (--p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.texts.length - 1; i >= 0; i--) {
          const t = this.texts[i];
          t.y += t.vy;
          if (--t.life <= 0) this.texts.splice(i, 1);
        }
      },
      draw(ctx) {
        for (const p of this.particles) {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.5, p.r * (p.life / p.maxLife)), 0, Math.PI * 2);
          ctx.fill();
        }
        for (const t of this.texts) {
          ctx.save();
          ctx.font = 'bold 11px monospace';
          ctx.fillStyle = t.color;
          ctx.shadowColor = t.color;
          ctx.shadowBlur = 8;
          ctx.fillText(t.str, t.x - ctx.measureText(t.str).width / 2, t.y);
          ctx.restore();
        }
      }
    };

    // --- Canvas Setup ---
    const canvas = document.getElementById('contraCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const vp = document.getElementById('viewport');
      const targetRatio = 480 / 270;
      let finalW = vp.clientWidth;
      let finalH = vp.clientWidth / targetRatio;
      if (finalH > vp.clientHeight) {
        finalH = vp.clientHeight;
        finalW = vp.clientHeight * targetRatio;
      }
      canvas.style.width = `${finalW}px`;
      canvas.style.height = `${finalH}px`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Game World State ---
    const gameState = {
      stage: 1,
      score: 0,
      lives: 3,
      camX: 0,
      camY: 0,
      bullets: [],
      enemyBullets: [],
      enemies: [],
      capsules: [],
      platforms: [],
      boss: null,
      player: null,
      paused: false
    };

    class Player {
      constructor() {
        this.reset(60, 180);
      }
      reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.w = 14;
        this.h = 24;
        this.grounded = false;
        this.facing = 1;
        this.aimDir = { x: 1, y: 0 };
        this.crouch = false;
        this.rolling = false;
        this.rollAngle = 0;
        this.gun = 'R';
        this.shootCd = 0;
        this.invuln = 70;
      }
      update() {
        if (this.invuln > 0) this.invuln--;

        const up = Input.up;
        const down = Input.down;
        const left = Input.left;
        const right = Input.right;

        if (left) this.facing = -1;
        if (right) this.facing = 1;

        this.crouch = down && this.grounded && !left && !right;

        // ทิศทางการเล็ง 8 ทิศทาง
        if (this.crouch) {
          this.aimDir = { x: this.facing, y: 0 };
        } else if (up && (left || right)) {
          this.aimDir = { x: this.facing * 0.707, y: -0.707 }; // เฉียงขึ้น 45°
        } else if (down && (left || right)) {
          this.aimDir = { x: this.facing * 0.707, y: 0.707 };  // เฉียงลง 45°
        } else if (up) {
          this.aimDir = { x: 0, y: -1 };                        // เล็งขึ้นฟ้าตรงๆ
        } else if (down && !this.grounded) {
          this.aimDir = { x: 0, y: 1 };                         // ทิ้งดิ่งลงล่างกลางอากาศ
        } else {
          this.aimDir = { x: this.facing, y: 0 };              // ยิงตรงไปข้างหน้า
        }

        // การเดิน
        if (!this.crouch) {
          if (left) this.vx = -2.8;
          else if (right) this.vx = 2.8;
          else this.vx = 0;
        } else {
          this.vx = 0;
        }

        // กระโดด หรือ โดดทิ้งตัวลอดแท่น
        if (Input.a && this.grounded) {
          if (down && this.y < 235) {
            this.y += 6;
            this.grounded = false;
          } else {
            this.vy = -7.2; // กระโดดสูงขึ้น ข้ามแท่นสบาย
            this.grounded = false;
            this.rolling = true;
            AudioEngine.jump();
          }
        }

        this.vy += 0.34;
        this.x += this.vx;
        this.y += this.vy;

        if (this.rolling) {
          this.rollAngle += 0.3 * this.facing;
        }

        // ชนแท่นยืน
        this.grounded = false;
