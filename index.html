<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Hub XL</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 15px 10px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .menu-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 500px;
        }
        .btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn.active {
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        #game-card {
            position: relative;
            width: 480px;
            max-width: 95vw;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #030712;
            display: block;
            width: 100%;
            height: auto;
        }
        .controls {
            width: 100%;
            padding: 12px;
            display: grid;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ctrl-btn {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 5px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #0f172a;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f172a;
            background: #475569;
        }
        .btn-action {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%) !important;
        }
        .btn-jump {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%) !important;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Arcade Hub XL</h1>
        <p style="margin:0; font-size: 12px; color: #64748b;">ศูนย์รวมมินิเกมบนเว็บเบราว์เซอร์</p>
    </div>

    <!-- เมนูเลือกเกม -->
    <div class="menu-bar">
        <button class="btn active" id="btn-flappy" onclick="switchGame('flappy')">Flappy Bird</button>
        <button class="btn" id="btn-snake" onclick="switchGame('snake')">Snake</button>
        <button class="btn" id="btn-tetris" onclick="switchGame('tetris')">Tetris</button>
        <button class="btn" id="btn-shooter" onclick="switchGame('shooter')">Space Shooter 🚀</button>
        <button class="btn" id="btn-breaker" onclick="switchGame('breaker')">Brick Breaker 🧱</button>
        <button class="btn" id="btn-contra" onclick="switchGame('contra')">Mini Contra 🎖️</button>
    </div>

    <!-- พื้นที่แสดงเกม -->
    <div id="game-card">
        <canvas id="canvas" width="480" height="560"></canvas>
        
        <!-- ปุ่มควบคุมสำหรับเกมงู -->
        <div id="snake-controls" class="controls hidden" style="grid-template-columns: repeat(3, 1fr);">
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('UP')">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('LEFT')">◄</button>
            <button class="ctrl-btn" onclick="setSnakeDir('DOWN')">▼</button>
            <button class="ctrl-btn" onclick="setSnakeDir('RIGHT')">►</button>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Tetris -->
        <div id="tetris-controls" class="controls hidden" style="grid-template-columns: repeat(3, 1fr);">
            <button class="ctrl-btn" onclick="moveTetris(-1)">◄ ซ้าย</button>
            <button class="ctrl-btn" onclick="rotateTetris()">↻ หมุน</button>
            <button class="ctrl-btn" onclick="moveTetris(1)">ขวา ►</button>
            <div></div>
            <button class="ctrl-btn" onclick="dropTetris()">▼ ลง</button>
            <div></div>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Space Shooter -->
        <div id="shooter-controls" class="controls hidden" style="grid-template-columns: repeat(2, 1fr);">
            <button class="ctrl-btn" 
                ontouchstart="startShooterMove(-1)" ontouchend="stopShooterMove()" 
                onmousedown="startShooterMove(-1)" onmouseup="stopShooterMove()">◄ เลื่อนซ้าย</button>
            <button class="ctrl-btn" 
                ontouchstart="startShooterMove(1)" ontouchend="stopShooterMove()" 
                onmousedown="startShooterMove(1)" onmouseup="stopShooterMove()">เลื่อนขวา ►</button>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Brick Breaker -->
        <div id="breaker-controls" class="controls hidden" style="grid-template-columns: repeat(2, 1fr);">
            <button class="ctrl-btn" 
                ontouchstart="startBreakerMove(-1)" ontouchend="stopBreakerMove()" 
                onmousedown="startBreakerMove(-1)" onmouseup="stopBreakerMove()">◄ ซ้าย</button>
            <button class="ctrl-btn" 
                ontouchstart="startBreakerMove(1)" ontouchend="stopBreakerMove()" 
                onmousedown="startBreakerMove(1)" onmouseup="stopBreakerMove()">ขวา ►</button>
        </div>

        <!-- ปุ่มควบคุมสำหรับ Mini Contra -->
        <div id="contra-controls" class="controls hidden" style="grid-template-columns: repeat(4, 1fr);">
            <button class="ctrl-btn" 
                ontouchstart="startContraMove(-1)" ontouchend="stopContraMove()" 
                onmousedown="startContraMove(-1)" onmouseup="stopContraMove()">◄ ซ้าย</button>
            <button class="ctrl-btn" 
                ontouchstart="startContraMove(1)" ontouchend="stopContraMove()" 
                onmousedown="startContraMove(1)" onmouseup="stopContraMove()">ขวา ►</button>
            <button class="ctrl-btn btn-jump" onclick="contraJump()">🦘 โดด</button>
            <button class="ctrl-btn btn-action" onclick="contraShoot()">🔥 ยิง</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const snakeControls = document.getElementById("snake-controls");
        const tetrisControls = document.getElementById("tetris-controls");
        const shooterControls = document.getElementById("shooter-controls");
        const breakerControls = document.getElementById("breaker-controls");
        const contraControls = document.getElementById("contra-controls");

        let currentGame = 'flappy';
        let gameLoopId = null;

        function switchGame(gameName) {
            currentGame = gameName;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${gameName}`).classList.add('active');

            snakeControls.classList.add("hidden");
            tetrisControls.classList.add("hidden");
            shooterControls.classList.add("hidden");
            breakerControls.classList.add("hidden");
            contraControls.classList.add("hidden");

            if (tetrisInterval) clearInterval(tetrisInterval);
            if (snakeInterval) clearInterval(snakeInterval);

            if (gameName === 'snake') {
                snakeControls.classList.remove("hidden");
                initSnake();
            } else if (gameName === 'tetris') {
                tetrisControls.classList.remove("hidden");
                initTetris();
            } else if (gameName === 'shooter') {
                shooterControls.classList.remove("hidden");
                initShooter();
            } else if (gameName === 'breaker') {
                breakerControls.classList.remove("hidden");
                initBreaker();
            } else if (gameName === 'contra') {
                contraControls.classList.remove("hidden");
                initContra();
            } else {
                initFlappy();
            }
        }

        // ==========================================
        // 1. GAME: FLAPPY BIRD
        // ==========================================
        let flappyPlayer, flappyPipes, flappyScore, flappyGameOver;

        function initFlappy() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            flappyPlayer = { x: 80, y: 250, w: 26, h: 26, v: 0, g: 0.4, jump: -7.5 };
            flappyPipes = [];
            flappyScore = 0;
            flappyGameOver = false;
            loopFlappy();
        }

        function triggerFlappyJump() {
            if (currentGame !== 'flappy') return;
            if (flappyGameOver) initFlappy();
            else flappyPlayer.v = flappyPlayer.jump;
        }

        function loopFlappy() {
            if (currentGame !== 'flappy') return;

            if (!flappyGameOver) {
                flappyPlayer.v += flappyPlayer.g;
                flappyPlayer.y += flappyPlayer.v;

                if (flappyPlayer.y + flappyPlayer.h >= canvas.height || flappyPlayer.y <= 0) {
                    flappyGameOver = true;
                }

                if (Math.random() < 0.016) {
                    let gap = 145;
                    let top = Math.floor(Math.random() * (canvas.height - gap - 80)) + 40;
                    flappyPipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - gap, passed: false });
                }

                for (let i = flappyPipes.length - 1; i >= 0; i--) {
                    let p = flappyPipes[i];
                    p.x -= 3.2;

                    if (flappyPlayer.x < p.x + 50 && flappyPlayer.x + flappyPlayer.w > p.x &&
                       (flappyPlayer.y < p.top || flappyPlayer.y + flappyPlayer.h > canvas.height - p.bottom)) {
                        flappyGameOver = true;
                    }

                    if (!p.passed && p.x + 50 < flappyPlayer.x) {
                        flappyScore++;
                        p.passed = true;
                    }

                    if (p.x < -60) flappyPipes.splice(i, 1);
                }
            }

            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f43f5e";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#f43f5e";
            ctx.fillRect(flappyPlayer.x, flappyPlayer.y, flappyPlayer.w, flappyPlayer.h);

            ctx.fillStyle = "#0284c7";
            ctx.shadowColor = "#0284c7";
            for (let p of flappyPipes) {
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 50, p.bottom);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("Score: " + flappyScore, 20, 35);

            if (flappyGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over - แตะเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopFlappy);
            }
        }

        // ==========================================
        // 2. GAME: SNAKE
        // ==========================================
        let snake, snakeDir, snakeFood, snakeScore, snakeGameOver, snakeInterval;

        function initSnake() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (snakeInterval) clearInterval(snakeInterval);
            
            snake = [{x: 240, y: 280}, {x: 216, y: 280}];
            snakeDir = 'RIGHT';
            snakeScore = 0;
            snakeGameOver = false;
            spawnSnakeFood();
            snakeInterval = setInterval(loopSnake, 100);
        }

        function setSnakeDir(dir) {
            if (dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
            if (dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
            if (dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
            if (dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
        }

        function spawnSnakeFood() {
            snakeFood = {
                x: Math.floor(Math.random() * (canvas.width / 24)) * 24,
                y: Math.floor(Math.random() * (canvas.height / 24)) * 24
            };
        }

        function loopSnake() {
            if (currentGame !== 'snake' || snakeGameOver) return;

            let head = { ...snake[0] };
            if (snakeDir === 'UP') head.y -= 24;
            if (snakeDir === 'DOWN') head.y += 24;
            if (snakeDir === 'LEFT') head.x -= 24;
            if (snakeDir === 'RIGHT') head.x += 24;

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                snakeGameOver = true;
            }

            if (!snakeGameOver) {
                snake.unshift(head);
                if (head.x === snakeFood.x && head.y === snakeFood.y) {
                    snakeScore += 10;
                    spawnSnakeFood();
                } else {
                    snake.pop();
                }
            }

            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ef4444";
            ctx.fillRect(snakeFood.x, snakeFood.y, 22, 22);

            ctx.fillStyle = "#22c55e";
            ctx.shadowColor = "#22c55e";
            for (let s of snake) {
                ctx.fillRect(s.x, s.y, 22, 22);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("Score: " + snakeScore, 20, 35);

            if (snakeGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over - กดปุ่มเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }
        }

        // ==========================================
        // 3. GAME: TETRIS
        // ==========================================
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 26;
        const BOARD_OFFSET_X = 110;
        let board, currentPiece, tetrisScore, tetrisGameOver, tetrisInterval;

        const SHAPES = [
            { shape: [[1, 1, 1, 1]], color: '#06b6d4' },
            { shape: [[1, 1], [1, 1]], color: '#eab308' },
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' },
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' },
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#f97316' },
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' },
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }
        ];

        function initTetris() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (tetrisInterval) clearInterval(tetrisInterval);

            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            tetrisScore = 0;
            tetrisGameOver = false;
            spawnTetrisPiece();
            tetrisInterval = setInterval(loopTetris, 420);
            drawTetris();
        }

        function spawnTetrisPiece() {
            const random = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            currentPiece = {
                shape: random.shape,
                color: random.color,
                x: Math.floor(COLS / 2) - Math.floor(random.shape[0].length / 2),
                y: 0
            };

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                tetrisGameOver = true;
            }
        }

        function checkCollision(x, y, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = x + c;
                        let newY = y + r;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function lockPiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    tetrisScore += 100;
                    r++;
                }
            }
            spawnTetrisPiece();
        }

        function moveTetris(dir) {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x + dir, currentPiece.y, currentPiece.shape)) {
                currentPiece.x += dir;
                drawTetris();
            }
        }

        function dropTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
            } else {
                lockPiece();
            }
            drawTetris();
        }

        function rotateTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            const rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
            if (!checkCollision(currentPiece.x, currentPiece.y, rotated)) {
                currentPiece.shape = rotated;
                drawTetris();
            }
        }

        function loopTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            dropTetris();
        }

        function drawTetris() {
            if (currentGame !== 'tetris') return;

            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1e293b";
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }

            if (currentPiece && !tetrisGameOver) {
                ctx.fillStyle = currentPiece.color;
                for (let r = 0; r < currentPiece.shape.length; r++) {
                    for (let c = 0; c < currentPiece.shape[r].length; c++) {
                        if (currentPiece.shape[r][c]) {
                            ctx.fillRect(
                                BOARD_OFFSET_X + (currentPiece.x + c) * BLOCK_SIZE,
                                (currentPiece.y + r) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
            }

            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText("Score: " + tetrisScore, 10, 30);

            if (tetrisGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        // ==========================================
        // 4. GAME: SPACE SHOOTER
        // ==========================================
        let shooterPlayer, bullets, enemies, shooterScore, shooterGameOver;
        let shooterMoveDir = 0;
        let shootTimer = 0;

        function initShooter() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            shooterPlayer = { x: canvas.width / 2 - 20, y: canvas.height - 60, w: 40, h: 30, speed: 6 };
            bullets = [];
            enemies = [];
            shooterScore = 0;
            shooterGameOver = false;
            shooterMoveDir = 0;
            loopShooter();
        }

        function startShooterMove(dir) { shooterMoveDir = dir; }
        function stopShooterMove() { shooterMoveDir = 0; }

        function loopShooter() {
            if (currentGame !== 'shooter') return;

            if (!shooterGameOver) {
                if (shooterMoveDir !== 0) {
                    shooterPlayer.x += shooterMoveDir * shooterPlayer.speed;
                    if (shooterPlayer.x < 0) shooterPlayer.x = 0;
                    if (shooterPlayer.x + shooterPlayer.w > canvas.width) shooterPlayer.x = canvas.width - shooterPlayer.w;
                }

                shootTimer++;
                if (shootTimer % 16 === 0) {
                    bullets.push({ x: shooterPlayer.x + shooterPlayer.w / 2 - 3, y: shooterPlayer.y, w: 6, h: 14 });
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= 9;
                    if (bullets[i].y < 0) bullets.splice(i, 1);
                }

                if (Math.random() < 0.04) {
                    enemies.push({ x: Math.random() * (canvas.width - 35), y: -35, w: 35, h: 35, speed: Math.random() * 2.5 + 2.5 });
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    if (shooterPlayer.x < e.x + e.w && shooterPlayer.x + shooterPlayer.w > e.x &&
                        shooterPlayer.y < e.y + e.h && shooterPlayer.y + shooterPlayer.h > e.y) {
                        shooterGameOver = true;
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                            shooterScore += 10;
                            enemies.splice(i, 1);
                            bullets.splice(j, 1);
                            break;
                        }
                    }

                    if (e && e.y > canvas.height) enemies.splice(i, 1);
                }
            }

            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#38bdf8";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(shooterPlayer.x + shooterPlayer.w / 2, shooterPlayer.y);
            ctx.lineTo(shooterPlayer.x, shooterPlayer.y + shooterPlayer.h);
            ctx.lineTo(shooterPlayer.x + shooterPlayer.w, shooterPlayer.y + shooterPlayer.h);
            ctx.fill();

            ctx.fillStyle = "#facc15";
            ctx.shadowColor = "#facc15";
            for (let b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

            ctx.fillStyle = "#ef4444";
            ctx.shadowColor = "#ef4444";
            for (let e of enemies) ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("Score: " + shooterScore, 20, 35);

            if (shooterGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopShooter);
            }
        }

        // ==========================================
        // 5. GAME: BRICK BREAKER
        // ==========================================
        let paddle, ball, bricks, breakerScore, breakerGameOver, breakerMoveDir = 0;
        const BRICK_ROWS = 5;
        const BRICK_COLS = 7;

        function initBreaker() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            paddle = { x: canvas.width / 2 - 45, y: canvas.height - 40, w: 90, h: 14, speed: 7 };
            ball = { x: canvas.width / 2, y: canvas.height - 60, radius: 8, dx: 4, dy: -4 };
            breakerScore = 0;
            breakerGameOver = false;
            breakerMoveDir = 0;

            bricks = [];
            const brickW = 60;
            const brickH = 20;
            const padding = 6;
            const offsetLeft = 10;
            const offsetTop = 50;

            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks[r][c] = { x: c * (brickW + padding) + offsetLeft, y: r * (brickH + padding) + offsetTop, status: 1 };
                }
            }

            loopBreaker();
        }

        function startBreakerMove(dir) { breakerMoveDir = dir; }
        function stopBreakerMove() { breakerMoveDir = 0; }

        function loopBreaker() {
            if (currentGame !== 'breaker') return;

            if (!breakerGameOver) {
                if (breakerMoveDir !== 0) {
                    paddle.x += breakerMoveDir * paddle.speed;
                    if (paddle.x < 0) paddle.x = 0;
                    if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
                }

                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
                if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

                if (ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    ball.dy = -ball.dy;
                } else if (ball.y + ball.radius > canvas.height) {
                    breakerGameOver = true;
                }

                for (let r = 0; r < BRICK_ROWS; r++) {
                    for (let c = 0; c < BRICK_COLS; c++) {
                        let b = bricks[r][c];
                        if (b.status === 1) {
                            if (ball.x > b.x && ball.x < b.x + 60 && ball.y > b.y && ball.y < b.y + 20) {
                                ball.dy = -ball.dy;
                                b.status = 0;
                                breakerScore += 20;
                            }
                        }
                    }
                }
            }

            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#38bdf8";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#38bdf8";
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

            ctx.fillStyle = "#facc15";
            ctx.shadowColor = "#facc15";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#a855f7'];
            for (let r = 0; r < BRICK_ROWS; r++) {
                ctx.fillStyle = colors[r % colors.length];
                ctx.shadowColor = colors[r % colors.length];
                for (let c = 0; c < BRICK_COLS; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        ctx.fillRect(b.x, b.y, 60, 20);
                    }
                }
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("Score: " + breakerScore, 20, 35);

            if (breakerGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopBreaker);
            }
        }

        // ==========================================
        // 6. GAME: MINI CONTRA (ใหม่)
        // ==========================================
        let contraPlayer, contraBullets, contraEnemies, contraScore, contraGameOver, contraMoveDir = 0;
        const GROUND_Y = 480;

        function initContra() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            contraPlayer = {
                x: 50, y: GROUND_Y - 40, w: 24, h: 40,
                vx: 0, vy: 0, speed: 5,
                jumping: false, dir: 1
            };
            contraBullets = [];
            contraEnemies = [];
            contraScore = 0;
            contraGameOver = false;
            contraMoveDir = 0;
            loopContra();
        }

        function startContraMove(dir) {
            contraMoveDir = dir;
            if (dir !== 0) contraPlayer.dir = dir;
        }

        function stopContraMove() {
            contraMoveDir = 0;
        }

        function contraJump() {
            if (currentGame !== 'contra') return;
            if (contraGameOver) {
                initContra();
                return;
            }
            if (!contraPlayer.jumping) {
                contraPlayer.vy = -12;
                contraPlayer.jumping = true;
            }
        }

        function contraShoot() {
            if (currentGame !== 'contra' || contraGameOver) return;
            contraBullets.push({
                x: contraPlayer.dir === 1 ? contraPlayer.x + contraPlayer.w : contraPlayer.x - 10,
                y: contraPlayer.y + 12,
                w: 10, h: 4,
                vx: contraPlayer.dir * 10
            });
        }

        function loopContra() {
            if (currentGame !== 'contra') return;

            if (!contraGameOver) {
                // ขยับตัวละคร
                contraPlayer.x += contraMoveDir * contraPlayer.speed;
                if (contraPlayer.x < 0) contraPlayer.x = 0;
                if (contraPlayer.x + contraPlayer.w > canvas.width) contraPlayer.x = canvas.width - contraPlayer.w;

                // แรงโน้มถ่วง
                contraPlayer.vy += 0.6;
                contraPlayer.y += contraPlayer.vy;
                if (contraPlayer.y + contraPlayer.h >= GROUND_Y) {
                    contraPlayer.y = GROUND_Y - contraPlayer.h;
                    contraPlayer.vy = 0;
                    contraPlayer.jumping = false;
                }

                // กระสุน
                for (let i = contraBullets.length - 1; i >= 0; i--) {
                    let b = contraBullets[i];
                    b.x += b.vx;
                    if (b.x < 0 || b.x > canvas.width) contraBullets.splice(i, 1);
                }

                // สร้างศัตรู
                if (Math.random() < 0.025) {
                    contraEnemies.push({
                        x: canvas.width, y: GROUND_Y - 35,
                        w: 22, h: 35, speed: Math.random() * 2 + 2
                    });
                }

                // ศัตรูขยับ & ชน
                for (let i = contraEnemies.length - 1; i >= 0; i--) {
                    let e = contraEnemies[i];
                    e.x -= e.speed;

                    // ชนผู้เล่น
                    if (contraPlayer.x < e.x + e.w && contraPlayer.x + contraPlayer.w > e.x &&
                        contraPlayer.y < e.y + e.h && contraPlayer.y + contraPlayer.h > e.y) {
                        contraGameOver = true;
                    }

                    // ชนกระสุน
                    for (let j = contraBullets.length - 1; j >= 0; j--) {
                        let b = contraBullets[j];
                        if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                            contraScore += 20;
                            contraEnemies.splice(i, 1);
                            contraBullets.splice(j, 1);
                            break;
                        }
                    }

                    if (e && e.x + e.w < 0) contraEnemies.splice(i, 1);
                }
            }

            // Draw
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // พื้นดิน
            ctx.fillStyle = "#15803d";
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // ผู้เล่น (ทหาร)
            ctx.fillStyle = "#22c55e";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#22c55e";
            ctx.fillRect(contraPlayer.x, contraPlayer.y, contraPlayer.w, contraPlayer.h);

            // ปืน
            ctx.fillStyle = "#94a3b8";
            if (contraPlayer.dir === 1) ctx.fillRect(contraPlayer.x + contraPlayer.w, contraPlayer.y + 10, 10, 5);
            else ctx.fillRect(contraPlayer.x - 10, contraPlayer.y + 10, 10, 5);

            // กระสุน
            ctx.fillStyle = "#facc15";
            ctx.shadowColor = "#facc15";
            for (let b of contraBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

            // ศัตรู
            ctx.fillStyle = "#ef4444";
            ctx.shadowColor = "#ef4444";
            for (let e of contraEnemies) ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("Score: " + contraScore, 20, 35);

            if (contraGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("กดปุ่มกระโดด/สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopContra);
            }
        }

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (currentGame === 'flappy') triggerFlappyJump();
        }, { passive: false });

        canvas.addEventListener("mousedown", () => {
            if (currentGame === 'flappy') triggerFlappyJump();
        });

        initFlappy();
    </script>
</body>
</html>
