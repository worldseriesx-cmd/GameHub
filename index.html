<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Hub</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 15px;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #38bdf8;
        }
        .menu-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        #game-card {
            position: relative;
            width: 320px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #000;
            display: block;
        }
        .controls {
            width: 100%;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: #0f172a;
        }
        .ctrl-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 5px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: #475569;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mini Game Arcade</h1>
        <p style="margin:0; font-size: 12px; color: #94a3b8;">เลือกเกมที่ต้องการเล่นด้านล่าง</p>
    </div>

    <!-- เมนูเลือกเกม -->
    <div class="menu-bar">
        <button class="btn active" id="btn-flappy" onclick="switchGame('flappy')">Flappy Bird</button>
        <button class="btn" id="btn-snake" onclick="switchGame('snake')">Snake Game</button>
        <button class="btn" id="btn-tetris" onclick="switchGame('tetris')">Tetris</button>
    </div>

    <!-- พื้นที่แสดงเกม -->
    <div id="game-card">
        <canvas id="canvas" width="320" height="400"></canvas>
        
        <!-- ปุ่มควบคุมสำหรับเกมงู -->
        <div id="snake-controls" class="controls hidden">
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('UP')">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('LEFT')">◄</button>
            <button class="ctrl-btn" onclick="setSnakeDir('DOWN')">▼</button>
            <button class="ctrl-btn" onclick="setSnakeDir('RIGHT')">►</button>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Tetris -->
        <div id="tetris-controls" class="controls hidden">
            <button class="ctrl-btn" onclick="moveTetris(-1)">◄ ซ้าย</button>
            <button class="ctrl-btn" onclick="rotateTetris()">↻ หมุน</button>
            <button class="ctrl-btn" onclick="moveTetris(1)">ขวา ►</button>
            <div></div>
            <button class="ctrl-btn" onclick="dropTetris()">▼ ลง</button>
            <div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const snakeControls = document.getElementById("snake-controls");
        const tetrisControls = document.getElementById("tetris-controls");

        let currentGame = 'flappy';
        let gameLoopId = null;

        // --- ระบบสลับเกม ---
        function switchGame(gameName) {
            currentGame = gameName;
            document.getElementById("btn-flappy").classList.toggle("active", gameName === 'flappy');
            document.getElementById("btn-snake").classList.toggle("active", gameName === 'snake');
            document.getElementById("btn-tetris").classList.toggle("active", gameName === 'tetris');

            snakeControls.classList.add("hidden");
            tetrisControls.classList.add("hidden");
            if (tetrisInterval) clearInterval(tetrisInterval);
            if (snakeInterval) clearInterval(snakeInterval);

            if (gameName === 'snake') {
                snakeControls.classList.remove("hidden");
                initSnake();
            } else if (gameName === 'tetris') {
                tetrisControls.classList.remove("hidden");
                initTetris();
            } else {
                initFlappy();
            }
        }

        // ==========================================
        // 1. GAME: FLAPPY BIRD
        // ==========================================
        let flappyPlayer, flappyPipes, flappyScore, flappyGameOver;

        function initFlappy() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            flappyPlayer = { x: 50, y: 180, w: 20, h: 20, v: 0, g: 0.35, jump: -6 };
            flappyPipes = [];
            flappyScore = 0;
            flappyGameOver = false;
            loopFlappy();
        }

        function triggerFlappyJump() {
            if (currentGame !== 'flappy') return;
            if (flappyGameOver) initFlappy();
            else flappyPlayer.v = flappyPlayer.jump;
        }

        function loopFlappy() {
            if (currentGame !== 'flappy') return;

            if (!flappyGameOver) {
                flappyPlayer.v += flappyPlayer.g;
                flappyPlayer.y += flappyPlayer.v;

                if (flappyPlayer.y + flappyPlayer.h >= canvas.height || flappyPlayer.y <= 0) {
                    flappyGameOver = true;
                }

                if (Math.random() < 0.015) {
                    let gap = 110;
                    let top = Math.floor(Math.random() * (canvas.height - gap - 60)) + 30;
                    flappyPipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - gap, passed: false });
                }

                for (let i = flappyPipes.length - 1; i >= 0; i--) {
                    let p = flappyPipes[i];
                    p.x -= 2;

                    if (flappyPlayer.x < p.x + 35 && flappyPlayer.x + flappyPlayer.w > p.x &&
                       (flappyPlayer.y < p.top || flappyPlayer.y + flappyPlayer.h > canvas.height - p.bottom)) {
                        flappyGameOver = true;
                    }

                    if (!p.passed && p.x + 35 < flappyPlayer.x) {
                        flappyScore++;
                        p.passed = true;
                    }

                    if (p.x < -40) flappyPipes.splice(i, 1);
                }
            }

            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(flappyPlayer.x, flappyPlayer.y, flappyPlayer.w, flappyPlayer.h);

            ctx.fillStyle = "#0284c7";
            for (let p of flappyPipes) {
                ctx.fillRect(p.x, 0, 35, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 35, p.bottom);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "18px sans-serif";
            ctx.fillText("Score: " + flappyScore, 15, 30);

            if (flappyGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.fillText("Game Over - แตะเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopFlappy);
            }
        }

        // ==========================================
        // 2. GAME: SNAKE
        // ==========================================
        let snake, snakeDir, snakeFood, snakeScore, snakeGameOver, snakeInterval;

        function initSnake() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (snakeInterval) clearInterval(snakeInterval);
            
            snake = [{x: 160, y: 200}, {x: 140, y: 200}];
            snakeDir = 'RIGHT';
            snakeScore = 0;
            snakeGameOver = false;
            spawnSnakeFood();
            snakeInterval = setInterval(loopSnake, 120);
        }

        function setSnakeDir(dir) {
            if (dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
            if (dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
            if (dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
            if (dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
        }

        function spawnSnakeFood() {
            snakeFood = {
                x: Math.floor(Math.random() * (canvas.width / 20)) * 20,
                y: Math.floor(Math.random() * (canvas.height / 20)) * 20
            };
        }

        function loopSnake() {
            if (currentGame !== 'snake' || snakeGameOver) return;

            let head = { ...snake[0] };
            if (snakeDir === 'UP') head.y -= 20;
            if (snakeDir === 'DOWN') head.y += 20;
            if (snakeDir === 'LEFT') head.x -= 20;
            if (snakeDir === 'RIGHT') head.x += 20;

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                snakeGameOver = true;
            }

            if (!snakeGameOver) {
                snake.unshift(head);
                if (head.x === snakeFood.x && head.y === snakeFood.y) {
                    snakeScore += 10;
                    spawnSnakeFood();
                } else {
                    snake.pop();
                }
            }

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(snakeFood.x, snakeFood.y, 18, 18);

            ctx.fillStyle = "#22c55e";
            for (let s of snake) {
                ctx.fillRect(s.x, s.y, 18, 18);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "18px sans-serif";
            ctx.fillText("Score: " + snakeScore, 15, 30);

            if (snakeGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.fillText("Game Over - กดปุ่มเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }
        }

        // ==========================================
        // 3. GAME: TETRIS
        // ==========================================
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 20;
        const BOARD_OFFSET_X = 60; // จัดให้อยู่กลางจอ 320px
        let board, currentPiece, tetrisScore, tetrisGameOver, tetrisInterval;

        const SHAPES = [
            { shape: [[1, 1, 1, 1]], color: '#00f0f0' }, // I
            { shape: [[1, 1], [1, 1]], color: '#f0f000' }, // O
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#a000f0' }, // T
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#0000f0' }, // L
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#f0a000' }, // J
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#00f000' }, // S
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#f00000' }  // Z
        ];

        function initTetris() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (tetrisInterval) clearInterval(tetrisInterval);

            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            tetrisScore = 0;
            tetrisGameOver = false;
            spawnTetrisPiece();
            tetrisInterval = setInterval(loopTetris, 500);
            drawTetris();
        }

        function spawnTetrisPiece() {
            const random = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            currentPiece = {
                shape: random.shape,
                color: random.color,
                x: Math.floor(COLS / 2) - Math.floor(random.shape[0].length / 2),
                y: 0
            };

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                tetrisGameOver = true;
            }
        }

        function checkCollision(x, y, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = x + c;
                        let newY = y + r;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function lockPiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
            // ลบแถวที่เต็ม
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    tetrisScore += 100;
                    r++;
                }
            }
            spawnTetrisPiece();
        }

        function moveTetris(dir) {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x + dir, currentPiece.y, currentPiece.shape)) {
                currentPiece.x += dir;
                drawTetris();
            }
        }

        function dropTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
            } else {
                lockPiece();
            }
            drawTetris();
        }

        function rotateTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            const rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
            if (!checkCollision(currentPiece.x, currentPiece.y, rotated)) {
                currentPiece.shape = rotated;
                drawTetris();
            }
        }

        function loopTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            dropTetris();
        }

        function drawTetris() {
            if (currentGame !== 'tetris') return;

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดตารางพื้นหลัง
            ctx.strokeStyle = "#1e293b";
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }

            // วาดตัวต่อปัจจุบัน
            if (currentPiece && !tetrisGameOver) {
                ctx.fillStyle = currentPiece.color;
                for (let r = 0; r < currentPiece.shape.length; r++) {
                    for (let c = 0; c < currentPiece.shape[r].length; c++) {
                        if (currentPiece.shape[r][c]) {
                            ctx.fillRect(
                                BOARD_OFFSET_X + (currentPiece.x + c) * BLOCK_SIZE,
                                (currentPiece.y + r) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
            }

            // แสดงคะแนน
            ctx.fillStyle = "#fff";
            ctx.font = "16px sans-serif";
            ctx.fillText("Score: " + tetrisScore, 10, 25);

            if (tetrisGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "20px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "14px sans-serif";
                ctx.fillText("กดเปลี่ยนเกมแล้วสลับกลับเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        // Event Listeners สำหรับสัมผัสหน้าจอ Flappy Bird
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (currentGame === 'flappy') triggerFlappyJump();
            else if (currentGame === 'snake' && snakeGameOver) initSnake();
        }, { passive: false });

        canvas.addEventListener("mousedown", () => {
            if (currentGame === 'flappy') triggerFlappyJump();
            else if (currentGame === 'snake' && snakeGameOver) initSnake();
        });

        // เริ่มต้นด้วยเกมแรก
        initFlappy();
    </script>
</body>
</html>
