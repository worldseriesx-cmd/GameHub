<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Hub XL</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0 0 4px 0;
            font-size: 26px;
            color: #38bdf8;
        }
        .menu-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        #game-card {
            position: relative;
            width: 450px;
            max-width: 95vw;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #000;
            display: block;
            width: 100%;
            height: auto;
        }
        .controls {
            width: 100%;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: #0f172a;
        }
        .ctrl-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 16px 5px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            touch-action: manipulation;
        }
        .ctrl-btn:active, .ctrl-btn.active-hold {
            background: #475569;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mini Game Arcade</h1>
        <p style="margin:0; font-size: 13px; color: #94a3b8;">เลือกเกมที่ต้องการเล่นด้านล่าง</p>
    </div>

    <!-- เมนูเลือกเกม -->
    <div class="menu-bar">
        <button class="btn active" id="btn-flappy" onclick="switchGame('flappy')">Flappy Bird</button>
        <button class="btn" id="btn-snake" onclick="switchGame('snake')">Snake</button>
        <button class="btn" id="btn-tetris" onclick="switchGame('tetris')">Tetris</button>
        <button class="btn" id="btn-shooter" onclick="switchGame('shooter')">Space Shooter 🚀</button>
    </div>

    <!-- พื้นที่แสดงเกม -->
    <div id="game-card">
        <canvas id="canvas" width="450" height="550"></canvas>
        
        <!-- ปุ่มควบคุมสำหรับเกมงู -->
        <div id="snake-controls" class="controls hidden" style="grid-template-columns: repeat(3, 1fr);">
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('UP')">▲</button>
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('LEFT')">◄</button>
            <button class="ctrl-btn" onclick="setSnakeDir('DOWN')">▼</button>
            <button class="ctrl-btn" onclick="setSnakeDir('RIGHT')">►</button>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Tetris -->
        <div id="tetris-controls" class="controls hidden" style="grid-template-columns: repeat(3, 1fr);">
            <button class="ctrl-btn" onclick="moveTetris(-1)">◄ ซ้าย</button>
            <button class="ctrl-btn" onclick="rotateTetris()">↻ หมุน</button>
            <button class="ctrl-btn" onclick="moveTetris(1)">ขวา ►</button>
            <div></div>
            <button class="ctrl-btn" onclick="dropTetris()">▼ ลง</button>
            <div></div>
        </div>

        <!-- ปุ่มควบคุมสำหรับเกม Space Shooter (กดค้างเพื่อเลื่อน) -->
        <div id="shooter-controls" class="controls hidden">
            <button class="ctrl-btn" 
                ontouchstart="startShooterMove(-1)" ontouchend="stopShooterMove()" 
                onmousedown="startShooterMove(-1)" onmouseup="stopShooterMove()">◄ เลื่อนซ้าย</button>
            <button class="ctrl-btn" 
                ontouchstart="startShooterMove(1)" ontouchend="stopShooterMove()" 
                onmousedown="startShooterMove(1)" onmouseup="stopShooterMove()">เลื่อนขวา ►</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const snakeControls = document.getElementById("snake-controls");
        const tetrisControls = document.getElementById("tetris-controls");
        const shooterControls = document.getElementById("shooter-controls");

        let currentGame = 'flappy';
        let gameLoopId = null;

        function switchGame(gameName) {
            currentGame = gameName;
            document.getElementById("btn-flappy").classList.toggle("active", gameName === 'flappy');
            document.getElementById("btn-snake").classList.toggle("active", gameName === 'snake');
            document.getElementById("btn-tetris").classList.toggle("active", gameName === 'tetris');
            document.getElementById("btn-shooter").classList.toggle("active", gameName === 'shooter');

            snakeControls.classList.add("hidden");
            tetrisControls.classList.add("hidden");
            shooterControls.classList.add("hidden");

            if (tetrisInterval) clearInterval(tetrisInterval);
            if (snakeInterval) clearInterval(snakeInterval);

            if (gameName === 'snake') {
                snakeControls.classList.remove("hidden");
                initSnake();
            } else if (gameName === 'tetris') {
                tetrisControls.classList.remove("hidden");
                initTetris();
            } else if (gameName === 'shooter') {
                shooterControls.classList.remove("hidden");
                initShooter();
            } else {
                initFlappy();
            }
        }

        // ==========================================
        // 1. GAME: FLAPPY BIRD
        // ==========================================
        let flappyPlayer, flappyPipes, flappyScore, flappyGameOver;

        function initFlappy() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            flappyPlayer = { x: 70, y: 250, w: 25, h: 25, v: 0, g: 0.4, jump: -7 };
            flappyPipes = [];
            flappyScore = 0;
            flappyGameOver = false;
            loopFlappy();
        }

        function triggerFlappyJump() {
            if (currentGame !== 'flappy') return;
            if (flappyGameOver) initFlappy();
            else flappyPlayer.v = flappyPlayer.jump;
        }

        function loopFlappy() {
            if (currentGame !== 'flappy') return;

            if (!flappyGameOver) {
                flappyPlayer.v += flappyPlayer.g;
                flappyPlayer.y += flappyPlayer.v;

                if (flappyPlayer.y + flappyPlayer.h >= canvas.height || flappyPlayer.y <= 0) {
                    flappyGameOver = true;
                }

                if (Math.random() < 0.015) {
                    let gap = 140;
                    let top = Math.floor(Math.random() * (canvas.height - gap - 80)) + 40;
                    flappyPipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - gap, passed: false });
                }

                for (let i = flappyPipes.length - 1; i >= 0; i--) {
                    let p = flappyPipes[i];
                    p.x -= 3;

                    if (flappyPlayer.x < p.x + 45 && flappyPlayer.x + flappyPlayer.w > p.x &&
                       (flappyPlayer.y < p.top || flappyPlayer.y + flappyPlayer.h > canvas.height - p.bottom)) {
                        flappyGameOver = true;
                    }

                    if (!p.passed && p.x + 45 < flappyPlayer.x) {
                        flappyScore++;
                        p.passed = true;
                    }

                    if (p.x < -50) flappyPipes.splice(i, 1);
                }
            }

            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(flappyPlayer.x, flappyPlayer.y, flappyPlayer.w, flappyPlayer.h);

            ctx.fillStyle = "#0284c7";
            for (let p of flappyPipes) {
                ctx.fillRect(p.x, 0, 45, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 45, p.bottom);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "20px sans-serif";
            ctx.fillText("Score: " + flappyScore, 20, 35);

            if (flappyGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "22px sans-serif";
                ctx.fillText("Game Over - แตะเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopFlappy);
            }
        }

        // ==========================================
        // 2. GAME: SNAKE
        // ==========================================
        let snake, snakeDir, snakeFood, snakeScore, snakeGameOver, snakeInterval;

        function initSnake() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (snakeInterval) clearInterval(snakeInterval);
            
            snake = [{x: 220, y: 260}, {x: 195, y: 260}];
            snakeDir = 'RIGHT';
            snakeScore = 0;
            snakeGameOver = false;
            spawnSnakeFood();
            snakeInterval = setInterval(loopSnake, 110);
        }

        function setSnakeDir(dir) {
            if (dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
            if (dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
            if (dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
            if (dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
        }

        function spawnSnakeFood() {
            snakeFood = {
                x: Math.floor(Math.random() * (canvas.width / 25)) * 25,
                y: Math.floor(Math.random() * (canvas.height / 25)) * 25
            };
        }

        function loopSnake() {
            if (currentGame !== 'snake' || snakeGameOver) return;

            let head = { ...snake[0] };
            if (snakeDir === 'UP') head.y -= 25;
            if (snakeDir === 'DOWN') head.y += 25;
            if (snakeDir === 'LEFT') head.x -= 25;
            if (snakeDir === 'RIGHT') head.x += 25;

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                snakeGameOver = true;
            }

            if (!snakeGameOver) {
                snake.unshift(head);
                if (head.x === snakeFood.x && head.y === snakeFood.y) {
                    snakeScore += 10;
                    spawnSnakeFood();
                } else {
                    snake.pop();
                }
            }

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(snakeFood.x, snakeFood.y, 23, 23);

            ctx.fillStyle = "#22c55e";
            for (let s of snake) {
                ctx.fillRect(s.x, s.y, 23, 23);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "20px sans-serif";
            ctx.fillText("Score: " + snakeScore, 20, 35);

            if (snakeGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "22px sans-serif";
                ctx.fillText("Game Over - กดปุ่มเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }
        }

        // ==========================================
        // 3. GAME: TETRIS
        // ==========================================
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 25;
        const BOARD_OFFSET_X = 100;
        let board, currentPiece, tetrisScore, tetrisGameOver, tetrisInterval;

        const SHAPES = [
            { shape: [[1, 1, 1, 1]], color: '#00f0f0' },
            { shape: [[1, 1], [1, 1]], color: '#f0f000' },
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#a000f0' },
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#0000f0' },
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#f0a000' },
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#00f000' },
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#f00000' }
        ];

        function initTetris() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            if (tetrisInterval) clearInterval(tetrisInterval);

            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            tetrisScore = 0;
            tetrisGameOver = false;
            spawnTetrisPiece();
            tetrisInterval = setInterval(loopTetris, 450);
            drawTetris();
        }

        function spawnTetrisPiece() {
            const random = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            currentPiece = {
                shape: random.shape,
                color: random.color,
                x: Math.floor(COLS / 2) - Math.floor(random.shape[0].length / 2),
                y: 0
            };

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                tetrisGameOver = true;
            }
        }

        function checkCollision(x, y, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = x + c;
                        let newY = y + r;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function lockPiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    tetrisScore += 100;
                    r++;
                }
            }
            spawnTetrisPiece();
        }

        function moveTetris(dir) {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x + dir, currentPiece.y, currentPiece.shape)) {
                currentPiece.x += dir;
                drawTetris();
            }
        }

        function dropTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                currentPiece.y++;
            } else {
                lockPiece();
            }
            drawTetris();
        }

        function rotateTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            const rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
            if (!checkCollision(currentPiece.x, currentPiece.y, rotated)) {
                currentPiece.shape = rotated;
                drawTetris();
            }
        }

        function loopTetris() {
            if (currentGame !== 'tetris' || tetrisGameOver) return;
            dropTetris();
        }

        function drawTetris() {
            if (currentGame !== 'tetris') return;

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1e293b";
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(BOARD_OFFSET_X + c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }

            if (currentPiece && !tetrisGameOver) {
                ctx.fillStyle = currentPiece.color;
                for (let r = 0; r < currentPiece.shape.length; r++) {
                    for (let c = 0; c < currentPiece.shape[r].length; c++) {
                        if (currentPiece.shape[r][c]) {
                            ctx.fillRect(
                                BOARD_OFFSET_X + (currentPiece.x + c) * BLOCK_SIZE,
                                (currentPiece.y + r) * BLOCK_SIZE,
                                BLOCK_SIZE - 1,
                                BLOCK_SIZE - 1
                            );
                        }
                    }
                }
            }

            ctx.fillStyle = "#fff";
            ctx.font = "18px sans-serif";
            ctx.fillText("Score: " + tetrisScore, 10, 30);

            if (tetrisGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        // ==========================================
        // 4. GAME: SPACE SHOOTER (Smooth & Auto-Shoot)
        // ==========================================
        let shooterPlayer, bullets, enemies, shooterScore, shooterGameOver;
        let shooterMoveDir = 0;
        let shootTimer = 0;

        function initShooter() {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            shooterPlayer = { x: canvas.width / 2 - 20, y: canvas.height - 60, w: 40, h: 30, speed: 5 };
            bullets = [];
            enemies = [];
            shooterScore = 0;
            shooterGameOver = false;
            shooterMoveDir = 0;
            loopShooter();
        }

        function startShooterMove(dir) {
            shooterMoveDir = dir;
        }

        function stopShooterMove() {
            shooterMoveDir = 0;
        }

        function loopShooter() {
            if (currentGame !== 'shooter') return;

            if (!shooterGameOver) {
                // ขยับยานแบบสมูทตามทิศทางที่กดค้าง
                if (shooterMoveDir !== 0) {
                    shooterPlayer.x += shooterMoveDir * shooterPlayer.speed;
                    if (shooterPlayer.x < 0) shooterPlayer.x = 0;
                    if (shooterPlayer.x + shooterPlayer.w > canvas.width) shooterPlayer.x = canvas.width - shooterPlayer.w;
                }

                // ยิงกระสุนอัตโนมัติทุกๆ ช่วงเวลา
                shootTimer++;
                if (shootTimer % 18 === 0) {
                    bullets.push({ x: shooterPlayer.x + shooterPlayer.w / 2 - 3, y: shooterPlayer.y, w: 6, h: 14 });
                }

                // ขยับกระสุน
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= 8;
                    if (bullets[i].y < 0) bullets.splice(i, 1);
                }

                // สุ่มสร้างศัตรู
                if (Math.random() < 0.035) {
                    enemies.push({ x: Math.random() * (canvas.width - 35), y: -35, w: 35, h: 35, speed: Math.random() * 2 + 2.5 });
                }

                // ขยับศัตรู & ตรวจจับการชน
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    // ศัตรูชนยานผู้เล่น
                    if (shooterPlayer.x < e.x + e.w && shooterPlayer.x + shooterPlayer.w > e.x &&
                        shooterPlayer.y < e.y + e.h && shooterPlayer.y + shooterPlayer.h > e.y) {
                        shooterGameOver = true;
                    }

                    // กระสุนยิงโดนศัตรู
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                            shooterScore += 10;
                            enemies.splice(i, 1);
                            bullets.splice(j, 1);
                            break;
                        }
                    }

                    if (e && e.y > canvas.height) enemies.splice(i, 1);
                }
            }

            // Draw
            ctx.fillStyle = "#090d16";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดผู้เล่น (ยาน)
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(shooterPlayer.x + shooterPlayer.w / 2, shooterPlayer.y);
            ctx.lineTo(shooterPlayer.x, shooterPlayer.y + shooterPlayer.h);
            ctx.lineTo(shooterPlayer.x + shooterPlayer.w, shooterPlayer.y + shooterPlayer.h);
            ctx.fill();

            // วาดกระสุน
            ctx.fillStyle = "#facc15";
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }

            // วาดศัตรู
            ctx.fillStyle = "#ef4444";
            for (let e of enemies) {
                ctx.fillRect(e.x, e.y, e.w, e.h);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "20px sans-serif";
            ctx.fillText("Score: " + shooterScore, 20, 35);

            if (shooterGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.font = "24px sans-serif";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px sans-serif";
                ctx.fillText("สลับเกมเพื่อเริ่มใหม่", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            } else {
                gameLoopId = requestAnimationFrame(loopShooter);
            }
        }

        // Listeners สำหรับ Flappy Bird
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (currentGame === 'flappy') triggerFlappyJump();
        }, { passive: false });

        canvas.addEventListener("mousedown", () => {
            if (currentGame === 'flappy') triggerFlappyJump();
        });

        initFlappy();
    </script>
</body>
</html>
